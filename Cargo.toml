[workspace]
members = [
    ".",
    "crates/s2o-schema",
    "crates/s2o-platform",
    "crates/s2o-store",
    "crates/s2o-bus",
    "crates/cyberwall-core",
    "crates/cyberwall-backend-windows",
    "crates/cyberwall-backend-linux",
    "crates/cyberwall-cli",
    "crates/cyberdns",
    "crates/cybermesh",
    "crates/cyberdefender",
    "crates/cyberedr",
    "crates/cybersiem",
    "crates/cyberintel",
    "crates/cyberid",
    "crates/cyberztna",
    "crates/aegisd",
    "crates/aegis-cli",
]

[package]
name = "s2o-aegis-gui"
version = "0.7.2"
authors = ["Split2ops Software <support@zv9games.org>"]
edition = "2021"
license = "AGPL-3.0-only"
description = "S2O Aegis Executive Command Center (egui dashboard)"

[dependencies]
eframe = { version = "0.17.0" }
tokio = { version = "1.5", features = ["full"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cyberwall-core = { path = "crates/cyberwall-core" }
cyberwall-backend-windows = { path = "crates/cyberwall-backend-windows" }
s2o-platform = { path = "crates/s2o-platform" }

[[bin]]
name = "aegis-gui"
path = "src/aegis_gui.rs"
