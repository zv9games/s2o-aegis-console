[workspace]
members = [
    ".",
    "crates/s2o-schema",
    "crates/s2o-store",
    "crates/s2o-bus",
    "crates/s2o-kernel",
    "crates/cyberwall-core",
    "crates/cyberwall-backend-windows",
    "crates/cyberwall-backend-linux",
    "crates/cyberwall-backend-macos",
    "crates/cyberwall-cli",
    "crates/cyberdns",
    "crates/cybermesh",
    "crates/cyberdefender",
    "crates/cyberedr",
    "crates/cybersiem",
    "crates/cyberintel",
    "crates/cyberid",
    "crates/cyberztna",
    "crates/aegisd",
]
# Suite crates first — legacy egui root is optional / frozen.
default-members = [
    "crates/s2o-schema",
    "crates/s2o-store",
    "crates/s2o-bus",
    "crates/s2o-kernel",
    "crates/cyberwall-core",
    "crates/cyberwall-backend-windows",
    "crates/cyberwall-backend-linux",
    "crates/cyberwall-backend-macos",
    "crates/cyberwall-cli",
    "crates/cyberdns",
    "crates/cybermesh",
    "crates/cyberdefender",
    "crates/cyberedr",
    "crates/cybersiem",
    "crates/cyberintel",
    "crates/cyberid",
    "crates/cyberztna",
    "crates/aegisd",
]

[package]
name = "xallfirewall"
version = "0.7.2"
authors = ["Gregory <gregor.whitelight@gmail.com>"]
edition = "2021"

[dependencies]

eframe = { version = "0.17.0" }
tokio = { version = "1.5", features = ["full"] }
rand = "0.8"
chrono = "0.4"
winit = "0.26.1"
crossbeam = "0.8.0"
crossbeam-channel = "0.5.0"
s2o_net_lib = { path = "../net-lib" }
futures = "0.3"
winapi = { version = "0.3", features = ["winsock2", "ws2ipdef"] }
libc = "0.2"


[[bin]]
name = "xallfirewall"
path = "src/main.rs"

[[bin]]
name = "loader"
path = "src/interface1.rs"

[[bin]]
name = "platform"
path = "src/interface2.rs"

[[bin]]
name = "network"
path = "src/interface3.rs"

[[bin]]
name = "security"
path = "src/interface4.rs"

[[bin]]
name = "cyberfirewall"
path = "src/cyber_firewall.rs"

[[bin]]
name = "unblock_firewall"
path = "src/unblock_firewall.rs"



