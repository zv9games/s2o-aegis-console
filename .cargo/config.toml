# Windows MSVC default stack (~1 MiB) is too small for large clap CLIs (aegis)
# once fleet/playbook/policy subtrees grow; raise reserve for all Windows bins.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]
