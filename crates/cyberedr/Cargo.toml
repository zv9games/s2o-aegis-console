[package]
name = "cyberedr"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Split2ops Software <support@zv9games.org>"]

[[bin]]
name = "cyberedr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
colored = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
s2o-platform = { path = "../s2o-platform" }
s2o-schema = { path = "../s2o-schema" }
s2o-store = { path = "../s2o-store" }
