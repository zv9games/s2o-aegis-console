[package]
name = "cyberdns"
version = "0.2.0"
edition = "2021"
authors = ["Split2ops Software"]

[[bin]]
name = "cyberdns"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
colored = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
s2o-schema = { path = "../s2o-schema" }
s2o-store = { path = "../s2o-store" }
