[package]
name = "cyberdefender"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
authors = ["Split2ops Software <support@zv9games.org>"]

[[bin]]
name = "cyberdefender"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
colored = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
s2o-platform = { path = "../s2o-platform" }
