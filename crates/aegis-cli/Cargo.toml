[package]
name = "aegis-cli"
version = "0.1.0"
edition = "2021"
authors = ["Split2ops Software <support@split2ops.com>"]
description = "S2O Aegis Master Multiplexer CLI"

[[bin]]
name = "aegis"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
colored = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cyberwall-core = { path = "../cyberwall-core" }
cyberwall-backend-windows = { path = "../cyberwall-backend-windows" }
s2o-schema = { path = "../s2o-schema" }
s2o-bus = { path = "../s2o-bus" }
s2o_net_lib = { path = "../../../net-lib" }
