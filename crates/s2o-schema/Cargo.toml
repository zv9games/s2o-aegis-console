[package]
name = "s2o-schema"
version = "0.1.0"
edition = "2021"
authors = ["Split2ops Software"]
description = "S2O Aegis shared event/policy schema (suite data package)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.3", features = ["v4", "serde"] }
