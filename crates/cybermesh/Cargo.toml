[package]
name = "cybermesh"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Split2ops Software <support@zv9games.org>"]

[[bin]]
name = "cybermesh"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
colored = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
base64 = "0.22"
