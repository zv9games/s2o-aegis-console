[package]
name = "s2o-audit"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
authors = ["Split2ops Software <support@zv9games.org>"]

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
clap = { version = "4.4", features = ["derive"] }

[[bin]]
name = "aegis-audit"
path = "src/main.rs"
