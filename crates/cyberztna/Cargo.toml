[package]
name = "cyberztna"
version = "0.4.0"
edition = "2021"
authors = ["Split2ops Software"]

[[bin]]
name = "cyberztna"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
tokio = { version = "1.0", features = ["full"] }
colored = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["clock"] }
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = "0.5"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
rcgen = "0.13"
rustls = "0.23"
rustls-pemfile = "2"
jsonwebtoken = "9"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
s2o-kernel = { path = "../s2o-kernel" }
s2o-schema = { path = "../s2o-schema" }
s2o-store = { path = "../s2o-store" }
s2o-session = { path = "../s2o-session" }
