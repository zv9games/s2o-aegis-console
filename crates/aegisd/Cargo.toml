[package]
name = "aegisd"
version = "0.2.0"
edition = "2021"
authors = ["Split2ops Software"]

[[bin]]
name = "aegisd"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
colored = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
s2o-schema = { path = "../s2o-schema" }
s2o-store = { path = "../s2o-store" }
s2o-kernel = { path = "../s2o-kernel" }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
