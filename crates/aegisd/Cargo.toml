[package]
name = "aegisd"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
authors = ["Split2ops Software <support@zv9games.org>"]

[[bin]]
name = "aegisd"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
colored = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
cyberwall-core = { path = "../cyberwall-core" }
cyberwall-backend-windows = { path = "../cyberwall-backend-windows" }
s2o-schema = { path = "../s2o-schema" }
s2o-store = { path = "../s2o-store" }
s2o-bus = { path = "../s2o-bus" }
s2o-platform = { path = "../s2o-platform" }
aegis-fleet = { path = "../aegis-fleet" }
s2o-attest = { path = "../s2o-attest" }
s2o-policy = { path = "../s2o-policy" }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
